<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard ♡ Phuwin Payment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #E3F1FB;
      --card-blue-1: #A8D0EF;
      --card-blue-2: #C1E4F3;
      --cream-accent: #FFF9E6;
      --deep-accent: #7faed6;
      --text-dark: #2c4257;
      --text-sub: #54718a;
      --white: #ffffff;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
    }

    body {
      background: linear-gradient(180deg, #dce6ed 0%, #E3F1FB 50%, #eef4f8 100%);
      color: var(--text-dark);
      min-height: 100vh;
      padding: 24px 16px 80px;
      display: flex;
      justify-content: center;
    }

    .container { width: 100%; max-width: 440px; }
    #loginView { min-height: 75vh; display: flex; flex-direction: column; justify-content: center; }

    .card-panel {
      background: var(--white);
      border-radius: 26px;
      padding: 24px 20px;
      box-shadow: 0 8px 26px rgba(127, 174, 214, 0.3);
      border: 1.5px solid var(--card-blue-2);
      margin-bottom: 16px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 14px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      display: block;
      margin-bottom: 5px;
    }

    .input-box, .textarea-box {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--card-blue-2);
      border-radius: 16px;
      font-size: 13.5px;
      background: var(--white);
      color: var(--text-dark);
      outline: none;
      margin-bottom: 12px;
    }

    .input-box:focus, .textarea-box:focus {
      border-color: var(--deep-accent);
    }

    .btn-main {
      width: 100%;
      background: var(--deep-accent);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 18px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(127, 174, 214, 0.45);
    }

    .btn-logout {
      background: var(--white);
      border: 1.5px solid var(--card-blue-1);
      color: var(--text-dark);
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    #dashboardView { display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  </style>
</head>
<body>

  <div class="container">

    <!-- Login -->
    <div id="loginView">
      <div class="card-panel" style="text-align: center;">
        <h2 style="margin-bottom: 18px; font-size: 20px;">Admin Login ♡</h2>
        <form onsubmit="handleAuth(event)">
          <input type="email" id="email" class="input-box" placeholder="email" required autocomplete="off">
          <input type="password" id="password" class="input-box" placeholder="password" required autocomplete="off">
          <button type="submit" class="btn-main">เข้าสู่ระบบ ♡</button>
          <p id="authError" style="color:#e05260; font-size:12px; margin-top:10px; display:none;">ข้อมูลเข้าสู่ระบบไม่ถูกต้อง</p>
        </form>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardView">
      <div class="top-bar">
        <div style="font-weight: 700; font-size: 17px;">Phuwin Payment Admin ♡</div>
        <button type="button" class="btn-logout" onclick="logout()">ออกจากระบบ</button>
      </div>

      <div class="card-panel">
        <div class="panel-title">รูปภาพและชื่อร้าน ♡</div>

        <label class="field-label">ลิงก์แบนเนอร์:</label>
        <input type="url" id="bannerInp" class="input-box">

        <label class="field-label">ลิงก์รูปโปรไฟล์:</label>
        <input type="url" id="profileInp" class="input-box">

        <label class="field-label">ชื่อร้าน:</label>
        <input type="text" id="titleInp" class="input-box">

        <label class="field-label">ชื่อบัญชี (Account Name):</label>
        <input type="text" id="accOwnerInp" class="input-box">
      </div>

      <div class="card-panel">
        <div class="panel-title">เลขบัญชี & โน้ตสลิป ♡</div>

        <label class="field-label">k-plus:</label>
        <input type="text" id="kplusInp" class="input-box">

        <label class="field-label">wallet:</label>
        <input type="text" id="walletInp" class="input-box">

        <label class="field-label">ข้อความฟอร์มใหญ่:</label>
        <textarea id="formArtInp" class="textarea-box" rows="9"></textarea>

        <label class="field-label">ข้อความโน้ตสลิปที่ให้คัดลอก:</label>
        <input type="text" id="copyNoteInp" class="input-box">
      </div>

      <div class="card-panel">
        <div class="panel-title">รูปป้าย & เพลง ♡</div>

        <label class="field-label">ลิงก์รูปป้าย (ความชัดต้นฉบับ 100%):</label>
        <input type="url" id="postImgInp" class="input-box">

        <label class="field-label">ลิงก์เพลง (.mp3):</label>
        <input type="url" id="musicInp" class="input-box">
      </div>

      <button type="button" class="btn-main" id="saveBtn" style="padding:14px; margin-bottom:20px;" onclick="saveAll()">
        บันทึกข้อมูลขึ้นระบบทันที ♡
      </button>
    </div>

  </div>

  <script>
    const DB_COLLECTION = "phuwin_payment_data";
    const DB_DOC = "main_content";

    const TARGET_ID = "bWluYXN1a2lrdWJAZ21haWwuY29t";
    const TARGET_KEY = "amd5dWtheDA0Njk=";

    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let siteData = {
      banner: "https://file.garden/asG8Gt-rqWIpi3II/IMG_4980.jpeg",
      profile: "https://file.garden/asG8Gt-rqWIpi3II/IMG_4981.jpeg",
      pageTitle: "Phuwin Payment ♡",
      accOwner: "name : sasiwimon",
      kplusNum: "175-357-8087",
      walletNum: "092-805-9572",
      formArt: "💬𓈒♡⠀\n\n        ฝากคุณลูกค้ากำกับ𓈒  สลิป\n  ซื้อขายกับภูวินท์line@383dsyqf  ♡3♡𓈒🐈‍⬛\n\n       ธนาคาร 𓈒 คัดลอกไปใส่ตรง\n         𓈒💭╺     บันทึกช่วยจำ   !  \n\n       วอเล็ท 𓈒 คัดลอกไปใส่ตรง\n      ╺     ข้อความบอกผู้รับ   𓈒🗯️\n\n              ╺ กรณี “ลืม” โน๊ต \n     ให้โอนมา1฿ แล้วโน๊ตสลิปมา\n\n                                         ♡𓈒📓𓈒⚫️",
      copyNote: "ซื้อขายกับภูวินท์line@383dsyqf",
      postImg: "https://file.garden/asG8Gt-rqWIpi3II/IMG_4982.jpeg",
      musicUrl: "https://file.garden/asG8Gt-rqWIpi3II/Wistoria%20Wand%20and%20Sword%20Season%202%20Full%20Opening%20Lyrics%20Believers%20ASH%20DA%20HERO.mp3"
    };

    window.onload = function() {
      if (sessionStorage.getItem('phuwin_auth') === 'true') {
        showDashboard();
      }
    };

    function handleAuth(e) {
      e.preventDefault();
      const mail = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (btoa(mail) === TARGET_ID && btoa(pass) === TARGET_KEY) {
        sessionStorage.setItem('phuwin_auth', 'true');
        showDashboard();
      } else {
        document.getElementById('authError').style.display = 'block';
      }
    }

    function logout() {
      sessionStorage.removeItem('phuwin_auth');
      location.reload();
    }

    async function showDashboard() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';

      try {
        const doc = await db.collection(DB_COLLECTION).doc(DB_DOC).get();
        if (doc.exists) siteData = { ...siteData, ...doc.data() };
      } catch(err) {}

      document.getElementById('bannerInp').value = siteData.banner || '';
      document.getElementById('profileInp').value = siteData.profile || '';
      document.getElementById('titleInp').value = siteData.pageTitle || '';
      document.getElementById('accOwnerInp').value = siteData.accOwner || '';
      document.getElementById('kplusInp').value = siteData.kplusNum || '';
      document.getElementById('walletInp').value = siteData.walletNum || '';
      document.getElementById('formArtInp').value = siteData.formArt || '';
      document.getElementById('copyNoteInp').value = siteData.copyNote || '';
      document.getElementById('postImgInp').value = siteData.postImg || '';
      document.getElementById('musicInp').value = siteData.musicUrl || '';
    }

    async function saveAll() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึกข้อมูล ♡';

      siteData.banner = document.getElementById('bannerInp').value.trim();
      siteData.profile = document.getElementById('profileInp').value.trim();
      siteData.pageTitle = document.getElementById('titleInp').value.trim();
      siteData.accOwner = document.getElementById('accOwnerInp').value.trim();
      siteData.kplusNum = document.getElementById('kplusInp').value.trim();
      siteData.walletNum = document.getElementById('walletInp').value.trim();
      siteData.formArt = document.getElementById('formArtInp').value;
      siteData.copyNote = document.getElementById('copyNoteInp').value.trim();
      siteData.postImg = document.getElementById('postImgInp').value.trim();
      siteData.musicUrl = document.getElementById('musicInp').value.trim();

      try {
        await db.collection(DB_COLLECTION).doc(DB_DOC).set(siteData);
        alert('บันทึกข้อมูลสำเร็จเรียบร้อยแล้วค่ะ ♡');
      } catch(err) {
        alert('เกิดข้อผิดพลาดในการบันทึก กรุณาลองใหม่อีกครั้งค่ะ ♡');
      } finally {
        btn.disabled = false;
        btn.textContent = 'บันทึกข้อมูลขึ้นระบบทันที ♡';
      }
    }
  </script>
</body>
</html>
